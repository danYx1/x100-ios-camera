name: ZoomCam
options:
  bundleIdPrefix: com.zoomcam
  deploymentTarget:
    iOS: "16.0"
targets:
  ZoomCam:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zoomcam.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: ZoomCam
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна для съёмки"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Сохранение снимков в галерею"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
